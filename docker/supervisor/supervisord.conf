; nginx, php-fpm, sshd, the scheduler and the queue worker, supervised as one.
;
; `autorestart=true` on all three: if php-fpm dies the container should recover
; rather than serve 502s until someone notices.

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/scheduler
; www-data, not root: the scheduler writes logs, cache entries and the
; `withoutOverlapping` locks that php-fpm reads and writes too. Running it as
; root leaves root-owned files in storage/, and the next web request fails on
; a permission error that points nowhere near this file.
user=www-data
autostart=true
autorestart=true
priority=40
; It waits for vendor/ before exec'ing, so it must stay up long enough to count
; as started while it is still waiting.
startsecs=10
; `schedule:work` forks a child per due task. Without these, supervisor signals
; only the parent on shutdown and leaves the children orphaned mid-run.
stopasgroup=true
killasgroup=true
; Long enough for a running task to finish rather than be killed part-way
; through writing.
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=/usr/local/bin/queue
; www-data for the same reason as the scheduler: jobs write to storage/ and to
; the cache, and root-owned files there break the next web request.
user=www-data
autostart=true
; `true`, not the default `unexpected`: the worker exits 0 on purpose when
; --max-time is reached, and that exit is precisely when it needs restarting.
autorestart=true
priority=50
startsecs=10
stopasgroup=true
killasgroup=true
; Longer than the job timeout, so a worker handed SIGTERM mid-job finishes it
; rather than being killed part-way through.
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; One worker. To run more, add:
;   numprocs=3
;   process_name=%(program_name)s_%(process_num)02d
numprocs=1
