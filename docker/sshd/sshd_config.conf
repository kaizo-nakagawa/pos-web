# Keys only. There is no account password in this image and none should be set:
# a container reachable on a mapped port with password auth on is a standing
# invitation to a credential-stuffing bot.
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# Root by key. Inside a container root is the ordinary administrative account,
# and `prohibit-password` keeps it key-only regardless of the settings above.
PermitRootLogin prohibit-password

AuthorizedKeysFile .ssh/authorized_keys

# The app is configured by the mounted .env, which `php artisan` reads on its
# own, so an SSH session needs no environment handed to it.
PermitUserEnvironment no

UseDNS no
ClientAliveInterval 60
ClientAliveCountMax 3
