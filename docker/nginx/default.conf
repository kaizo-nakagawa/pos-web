server {
    # ${PORT} is substituted by the entrypoint. Coolify sets PORT and points
    # its proxy there -- it defaults to 3000, not 80, and a container listening
    # on the wrong one is a 502 with nothing wrong inside it.
    #
    # IPv4 only. Docker networks commonly have IPv6 disabled, and a `listen
    # [::]:...` line is fatal at startup when it is -- nginx exits with
    # "Address family not supported by protocol" and takes the container down.
    listen ${PORT} default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Response headers for every page. HSTS is left to Coolify's proxy, which
    # terminates TLS. `always` so error pages carry them too.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Sejalan dengan post_max_size di docker/php/php.ini.
    client_max_body_size 32m;

    # Answers before any PHP is involved, so the container reports healthy even
    # while `vendor/` is still missing. Without it Coolify would see the 500
    # that a dependency-less Laravel returns and restart the container in a
    # loop -- exactly when you need it up to SSH in and install them.
    location = /healthz {
        access_log off;
        # `default_type`, not an `add_header`: `return` builds its own response
        # and takes the content type from here, so add_header would leave it as
        # application/octet-stream.
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }


    # Vite writes hashed filenames, so these can be cached hard and forever.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Sama dengan max_execution_time di php.ini.
        fastcgi_read_timeout 120s;

        # Header `Link:` preload Vite dari Laravel bisa melebihi buffer
        # header default nginx (4k), yang langsung berujung 502.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
    }

    # Anything else ending in .php is not ours to run.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
