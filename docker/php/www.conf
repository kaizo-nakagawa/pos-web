[www]
; php-fpm's own logs to the container's stderr, so nothing is lost in a file
; nobody reads.
catch_workers_output = yes
decorate_workers_output = no

; Give a worker its own copy of the environment. Without this, php-fpm strips
; everything Coolify injects and Laravel starts with an empty config.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers periodically: cheap insurance against a slow leak in a
; long-lived process.
pm.max_requests = 500
