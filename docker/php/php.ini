; Setelan PHP runtime. Yang tidak disebut di sini memakai default image dasar.
memory_limit = 512M

; Impor CSV/XLSX dibatasi 5MB (ImportPreviewRequest); diberi ruang lebih.
upload_max_filesize = 16M
post_max_size = 32M
max_file_uploads = 20
max_execution_time = 120

; Jangan iklankan versi PHP di header respons.
expose_php = Off

; Error ke log container untuk `docker logs` / Coolify, tidak pernah ke
; body respons.
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Kode berubah di bawah container yang berjalan setiap deploy.bash (rsync),
; jadi timestamp tetap divalidasi.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
